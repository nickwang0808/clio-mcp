# Review and replace app/origin before use. This is not the existing US demo.
app = "replace-with-new-canadian-staging-app"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"
  build-target = "runtime"

[env]
  PORT = "8080"
  HOSTED_DATABASE_PATH = "/data/auth.sqlite"
  HOSTED_ORIGIN = "https://replace-with-new-canadian-staging-app.fly.dev"
  HOSTED_TRUST_FLY_PROXY = "true"

[[mounts]]
  source = "clio_auth"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"

# Exactly one Machine/process. Do not use release_command for volume migrations.
# Provision /data with UID/GID 1000 write access before starting the non-root image.
